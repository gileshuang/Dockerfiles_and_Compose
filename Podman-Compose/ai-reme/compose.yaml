name: ai-reme

services:
  reme:
    image: ghcr.io/agentscope-ai/reme:latest
    container_name: reme
    # 镜像已内置 tini 作为 ENTRYPOINT，不要再加 compose 的 init。
    init: false
    # 与宿主运行用户一致，保证 bind mount 出来的 Markdown 归属正确。
    # 以 root 运行 podman 时可改为 user: "1000:1000" 或直接删除本行使用镜像默认的 reme 用户。
    user: "${REME_UID:-1000}:${REME_GID:-1000}"
    network_mode: host
    #ports:
    #  - "${REME_BIND_ADDRESS:-127.0.0.1}:${REME_PUBLISHED_PORT:-2333}:${REME_PORT:-2333}"
    volumes:
      - type: bind
        source: ${REME_DATA_DIR:-./data}
        target: /data
        bind:
          create_host_path: false
    env_file:
      - path: ${REME_ENV_FILE:-.env}
        required: false
    environment:
      TZ: ${REME_TIMEZONE:-Asia/Shanghai}
      REME_HOST: ${REME_BIND_ADDRESS:-127.0.0.1}
      REME_PORT: ${REME_PORT:-2333}
      REME_WORKSPACE_DIR: /data
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "/usr/local/lib/reme_container.py", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
