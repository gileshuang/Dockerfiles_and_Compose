name: ai

services:
  reme:
    image: ghcr.io/agentscope-ai/reme:latest
    container_name: ai_reme
    # 镜像已内置 tini 作为 ENTRYPOINT，不要再加 compose 的 init。
    init: false
    # 与宿主运行用户一致，保证 bind mount 出来的 Markdown 归属正确。
    # 以 root 运行 podman 时可改为 user: "1000:1000" 或直接删除本行使用镜像默认的 reme 用户。
    user: "${REME_UID:-1000}:${REME_GID:-1000}"
    network_mode: host
    #ports:
    #  - "${REME_BIND_ADDRESS:-127.0.0.1}:${REME_PUBLISHED_PORT:-2333}:${REME_PORT:-2333}"
    env_file:
      - path: ${REME_ENV_FILE:-.env}
        required: false
    environment:
      TZ: ${REME_TIMEZONE:-Asia/Shanghai}
      REME_HOST: ${REME_BIND_ADDRESS:-127.0.0.1}
      REME_PORT: ${REME_PORT:-2333}
      REME_WORKSPACE_DIR: /data
    volumes:
      - ${REME_DATA_DIR:-./data}:/data
      - ${REME_DATA_CONFIG:-./config.yaml}:${REME_CONFIG:-/etc/reme/config.yaml}:ro
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "/usr/local/lib/reme_container.py", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

# Ollama · 本地 embedding 服务（CPU，供 ReMe 使用）
#
#   cd ai
#   podman-compose up -d
#   podman exec ai_ollama ollama pull bge-m3
#
# ReMe 侧配置（OpenAI 兼容端点）：
#   backend: openai
#   base_url: http://127.0.0.1:11434/v1
#   model: bge-m3
#   dimensions: 1024

  ollama:
    image: ${OLLAMA_IMAGE:-docker.io/ollama/ollama:latest}
    container_name: ai_ollama
    restart: unless-stopped
    x-podman.uidmaps:
      - "0:${OLLAMA_UID:-1000}:1"
    x-podman.gidmaps:
      - "0:${OLLAMA_GID:-1000}:1"
    # 与 ReMe 同机部署，直接共享宿主网络，免去 rootless 端口发布的依赖。
    # 若希望只映射端口，删掉 network_mode，改用下面的 ports。
    network_mode: host
    # ports:
    #   - "127.0.0.1:11434:11434"
    # 无 GPU 时的资源上限：bge-m3 在 4 核 / 4G 下约 20–40 chunk/s。
    cpus: 8
    mem_limit: 8g
    volumes:
      # 模型与运行数据落在宿主；首次 pull 后在此生成 blobs/ 与 manifests/。
      # 宿主路径需事先存在，且属主为运行 podman 的用户。
      - ${OLLAMA_DATA_DIR:-./ollama}:/root/.ollama
    environment:
      TZ: ${OLLAMA_TIMEZONE:-Asia/Shanghai}
      # 保持模型常驻，避免每次 embedding 请求冷加载。
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
